# WON Windows Build
#
# Builds the Windows installer (.exe) for the won/stable branch fork.
# No code signing required — unsigned build for personal use.
#
# On push to won/stable: uploads artifact (14-day retention).
# On push of a won/v* tag:  uploads artifact + creates a GitHub Release.

name: WON Windows Build

on:
  push:
    branches:
      - won/stable
    tags:
      - 'won/v*'

permissions:
  contents: write   # needed to create GitHub Releases

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-windows:
    name: Build Windows Installer
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Get npm cache directory
        id: npm-cache-dir
        shell: bash
        run: echo "dir=$(npm config get cache)" >> "$GITHUB_OUTPUT"

      - name: Cache npm dependencies
        uses: actions/cache@v4
        with:
          path: ${{ steps.npm-cache-dir.outputs.dir }}
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: ${{ runner.os }}-npm-

      - name: Install dependencies
        shell: bash
        run: npm ci

      - name: Link node_modules for electron-builder
        shell: bash
        # electron-builder expects node_modules in apps/frontend.
        # With npm workspaces, packages are hoisted to root. Create a junction
        # so electron-builder can find modules during packaging.
        run: |
          if [ -e "apps/frontend/node_modules" ] || [ -L "apps/frontend/node_modules" ]; then
            rm -rf "apps/frontend/node_modules"
          fi
          abs_target=$(cygpath -w "$(pwd)/node_modules")
          link_path=$(cygpath -w "$(pwd)/apps/frontend/node_modules")
          powershell -Command "New-Item -ItemType Junction -Path '$link_path' -Target '$abs_target'" > /dev/null
          echo "Created junction: apps/frontend/node_modules -> $abs_target"

      - name: Build application (electron-vite)
        working-directory: apps/frontend
        shell: bash
        run: npm run build

      - name: Package Windows installer (unsigned)
        working-directory: apps/frontend
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Disable all code signing — unsigned build for personal use
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
          WIN_CSC_LINK: ''
        run: npm run package:win

      - name: Upload Windows installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: won-windows-installer
          path: |
            apps/frontend/dist/*.exe
            apps/frontend/dist/*.yml
            apps/frontend/dist/*.blockmap
          retention-days: 14
          if-no-files-found: error

      - name: Create GitHub Release (tag builds only)
        if: startsWith(github.ref, 'refs/tags/won/v')
        uses: softprops/action-gh-release@v2
        with:
          name: "WON Build ${{ github.ref_name }}"
          tag_name: ${{ github.ref_name }}
          body: |
            ## WON Build — Aperant Fork

            Windows installer built from branch `won/stable` with all WON patches applied.

            ### Patches included
            - Notifications: silent failure wrapped in try-catch
            - Kanban: task no longer disappears before merge
            - Insights: cache invalidated after task creation
            - PR Review: strips trailing CR from subprocess output on Windows
            - QA Deadlock: QA proceeds when subtasks are stuck or failed
            - F12 DevTools: enabled in production builds
            - Sonnet 4.6: updated model ID to `claude-sonnet-4-6`
            - pt-BR: complete Brazilian Portuguese translation

            ### Install
            Download the `.exe` file below, run it, and follow the installer.
            > ⚠️ Windows may show a SmartScreen warning — this is expected for unsigned builds. Click "More info → Run anyway".
          files: |
            apps/frontend/dist/*.exe
            apps/frontend/dist/*.blockmap
          draft: false
          prerelease: false
